services:
  # ─── Backend (Laravel + PHP-FPM) ────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oss-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./docker/scripts:/docker/scripts
    environment:
      APP_NAME: ${APP_NAME:-One Stop Service}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-one_stop_service}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/docker/scripts/entrypoint.sh"]
    networks:
      - oss-network

  # ─── Nginx (Reverse Proxy) ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: oss-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - oss-network

  # ─── PostgreSQL Database ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oss-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-one_stop_service}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-one_stop_service}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oss-network

volumes:
  postgres_data:
    driver: local

networks:
  oss-network:
    driver: bridge
